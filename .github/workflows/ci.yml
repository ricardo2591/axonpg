name: AxonPG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install AxonPG (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check src tests
      - name: Run Unit & Security Tests (SQLite --lite mode)
        run: pytest -m "not integration"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: axonpg
          POSTGRES_USER: axonpg
          POSTGRES_PASSWORD: axonpg_ci_password
        ports:
          - 5435:5432
        options: >-
          --health-cmd="pg_isready -U axonpg -d axonpg"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install AxonPG (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run PostgreSQL + pgvector Integration Tests
        env:
          AXONPG_RUN_PG_TESTS: "1"
          AXONPG_DB_HOST: "127.0.0.1"
          AXONPG_DB_PORT: "5435"
          AXONPG_DB_NAME: "axonpg"
          AXONPG_DB_USER: "axonpg"
          AXONPG_DB_PASSWORD: "axonpg_ci_password"
        run: pytest -m integration -v
