[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axonpg"
version = "0.1.0"
description = "Postgres-native multilingual cognitive memory engine (Graph + Hybrid Vector/BM25 + Episodic + Foresight) for Hermes Agent and OpenClaw via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ricardo Burgos", email = "drburgos123@gmail.com"}]
keywords = ["ai-agents", "memory", "mcp", "postgresql", "pgvector", "hermes-agent", "openclaw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.9.0",
    "questionary>=2.0.1",
]

[project.optional-dependencies]
local = ["fastembed>=0.9.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
axonpg = "axonpg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests requiring a live PostgreSQL + pgvector instance",
]
