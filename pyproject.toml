[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axonpg"
version = "0.1.0"
description = "Postgres-native cognitive memory engine (Graph + Hybrid Vector + Episodic + Foresight) for Hermes Agent and OpenClaw via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ricardo Burgos", email = "drburgos123@gmail.com"}]
dependencies = [
    "mcp>=1.2.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
local = ["fastembed>=0.3.6"]
dev = ["pytest>=8.0.0"]

[project.scripts]
axonpg = "axonpg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
